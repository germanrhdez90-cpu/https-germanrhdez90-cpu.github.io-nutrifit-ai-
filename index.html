<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008e65"><meta name="apple-mobile-web-app-capable" content="yes"><title>NutriFit AI</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f8f5;color:#133c30;font:16px system-ui}header{padding:18px;background:#fff;font-size:24px;font-weight:bold}main{padding:16px 16px 100px;max-width:700px;margin:auto}h2{margin:10px 0}.card{background:white;border:1px solid #dce6de;border-radius:18px;padding:17px;margin:12px 0}.hero{background:linear-gradient(120deg,#073e34,#00966b);color:white;border-radius:20px;padding:24px}.muted{color:#687c71;font-size:13px}button{border:0;border-radius:11px;padding:12px;background:#008e65;color:white;font:inherit;cursor:pointer;margin:3px}input,select{width:100%;padding:10px;border:1px solid #d2ded5;border-radius:9px;font:inherit;margin:5px 0 10px}label{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.set{display:grid;grid-template-columns:25px repeat(3,1fr) 30px;gap:6px;align-items:center}.set input{min-width:0;padding:7px}.set input[type=checkbox]{width:20px}.meso{border-left:7px solid var(--c);padding:15px;background:white;border-radius:12px;margin:10px 0}.tabs{display:flex;overflow:auto}.tabs button{background:#e0eee7;color:#174c38}.tabs button.on{background:#008e65;color:white}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;border-top:1px solid #dce6de;padding:8px 0 15px}nav button{background:none;color:#567367;font-size:12px;padding:5px}nav button.on{color:#008e65;font-weight:bold}</style><header>🌿 NutriFit AI</header><main id="app"></main><nav id="nav"></nav><script>
const names=['Fuerza funcional A','Bádminton','Atletismo · Intervalos','Bádminton','Fuerza funcional B','Rodaje aeróbico','Descanso'],phases=['Ajuste','Carga','Impacto','Recuperación'],mesos=['Base y adaptación','Consolidación aeróbica','Fuerza y resistencia','Umbral aeróbico','Velocidad','Economía de carrera','Rendimiento 5K','Rendimiento 10K','Cuestas y trail','Consolidación','Preparación específica','Puesta a punto','Evaluación'];let data=JSON.parse(localStorage.getItem('nf-data')||'{"sets":{},"sessions":{},"food":[],"weight":[]}'),page='Inicio',tab='Hoy',week=1;const save=()=>localStorage.setItem('nf-data',JSON.stringify(data)),el=id=>document.getElementById(id),btn=(t,code)=>'<button onclick="'+code+'">'+t+'</button>',start=new Date(2026,9,19),date=n=>new Date(2026,9,19+n),fmt=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});function render(){el('nav').innerHTML=['Inicio','Comidas','Entreno','Progreso','Perfil'].map(n=>'<button class="'+(page===n?'on':'')+'" onclick="page=\''+n+'\';render()">'+n+'</button>').join('');el('app').innerHTML=page==='Inicio'?home():page==='Entreno'?training():page==='Comidas'?food():page==='Progreso'?progress():profile()}
function home(){let i=(new Date().getDay()+6)%7;return '<h2>Vamos a por tu día</h2><div class="hero"><small>ENTRENAMIENTO DE HOY</small><h1>'+names[i]+'</h1>'+btn('Abrir sesión',"page='Entreno';tab='Hoy';render()")+'</div><div class="grid"><div class="card"><b>Nutrición</b><p>'+data.food.reduce((s,f)=>s+Number(f.kcal||0),0)+' kcal registradas</p></div><div class="card"><b>Progreso</b><p>'+(data.weight.at(-1)?.kg||'—')+' kg</p></div></div><div class="card"><h2>Esta semana</h2>'+names.map((n,i)=>'<p>'+['L','M','X','J','V','S','D'][i]+' · '+n+'</p>').join('')+'</div>'}
function training(){return '<h2>Entreno</h2><div class="tabs">'+['Hoy','Semana','Planificación','Cargas'].map(n=>'<button class="'+(tab===n?'on':'')+'" onclick="tab=\''+n+'\';render()">'+n+'</button>').join('')+'</div>'+(tab==='Hoy'?session((new Date().getDay()+6)%7,'today'):tab==='Semana'?weekly():tab==='Planificación'?planning():loads())}
function session(i,key){let ex=i===0?['Zancada estática','Peso muerto rumano','Press inclinado','Remo unilateral','Press Pallof']:i===4?['Sentadilla goblet','Peso muerto kettlebell','Remo unilateral','Suitcase carry','Dead bug']:[];let info=i===2?'12 min suave + 4 min técnica + 4 × 4 min a 5:45–5:55/km (2 min trote entre series) + 8 min suave':i===5?'25 min a 6:35–7:00/km + 10 min a 6:15–6:30/km + 5 min suave':i===6?'Recuperación y revisión semanal':'Registrar duración y esfuerzo';return '<div class="hero"><small>SESIÓN</small><h2>'+names[i]+'</h2></div><div class="card"><p>'+info+'</p>'+ex.map((n,j)=>exercise(n,key+'-'+j)).join('')+'<div class="grid"><label>Duración min<input type="number" id="mins" value="'+(data.sessions[key]?.mins||'')+'"></label><label>RPE 0–10<input type="number" id="rpe" value="'+(data.sessions[key]?.rpe||'')+'"></label></div>'+btn('Guardar sesión',"data.sessions['"+key+"']={mins:el('mins').value,rpe:el('rpe').value};save();alert('Guardado')")+'</div>'}
function exercise(n,key){let rows=data.sets[key]||Array.from({length:3},()=>({kg:'',reps:8,rir:3,done:false}));return '<details style="border-top:1px solid #e3eae5;padding:12px 0"><summary><b>'+n+'</b> · 3 series</summary><p class="muted">RIR 3 · descanso 75–90 s</p><div class="set"><small>#</small><small>kg</small><small>reps</small><small>RIR</small><small>✓</small></div>'+rows.map((r,j)=>'<div class="set"><span>'+(j+1)+'</span><input type="number" id="kg'+key+j+'" value="'+r.kg+'"><input type="number" id="rp'+key+j+'" value="'+r.reps+'"><input type="number" id="rir'+key+j+'" value="'+r.rir+'"><input type="checkbox" id="ok'+key+j+'" '+(r.done?'checked':'')+'></div>').join('')+btn('Guardar series',"store('"+key+"',"+rows.length+")")+'</details>'}
function store(k,n){data.sets[k]=Array.from({length:n},(_,i)=>({kg:el('kg'+k+i).value,reps:el('rp'+k+i).value,rir:el('rir'+k+i).value,done:el('ok'+k+i).checked}));save();alert('Series guardadas')}
function weekly(){return '<div class="card"><h2>Semana '+week+'</h2>'+btn('‹',"week=Math.max(1,week-1);render()")+btn('›',"week=Math.min(52,week+1);render()")+'</div>'+names.map((n,i)=>'<details class="card"><summary>'+fmt(date((week-1)*7+i))+' · '+n+'</summary>'+session(i,'w'+week+'d'+i)+'</details>').join('')}
function planning(){return '<h2>Macrociclo 2026–2027</h2><p>52 semanas · Inicio 19 de octubre</p>'+mesos.map((n,i)=>'<details class="meso" style="--c:'+['#1aa58d','#4488db','#a36cce','#e6a14e'][i%4]+'"><summary><b>M'+(i+1)+' · '+n+'</b><p class="muted">Semanas '+(i*4+1)+'–'+(i*4+4)+'</p></summary>'+phases.map((p,j)=>btn('S'+(i*4+j+1)+' · '+p,"week="+(i*4+j+1)+";tab='Semana';render()")).join('')+'</details>').join('')}
function loads(){let v=Object.values(data.sessions);return '<div class="card"><h2>Carga registrada</h2><h1>'+v.reduce((s,x)=>s+Number(x.mins||0)*Number(x.rpe||0),0)+' UA</h1><p class="muted">Duración × RPE · '+v.length+' sesiones guardadas. No se inventan datos.</p></div>'}
function food(){return '<h2>Nutrición</h2><div class="card"><h3>Nueva comida</h3><label>Foto desde cámara o galería<input type="file" accept="image/*"></label><p class="muted">Estimación manual: no se analizan imágenes automáticamente.</p><label>Descripción<input id="desc"></label><div class="grid">'+['kcal','proteína g','carbohidratos g','grasa g'].map((n,i)=>'<label>'+n+'<input type="number" id="f'+i+'"></label>').join('')+'</div>'+btn('Guardar comida',"data.food.push({date:new Date().toISOString(),desc:el('desc').value,kcal:el('f0').value,protein:el('f1').value,carbs:el('f2').value,fat:el('f3').value});save();render()")+'</div>'+data.food.slice().reverse().map(f=>'<div class="card"><b>'+f.desc.replace(/[<>]/g,'')+'</b><p>'+f.kcal+' kcal · '+f.protein+' g proteína</p></div>').join('')}
function progress(){return '<h2>Progreso</h2><div class="card"><h3>Nuevo peso</h3><label>kg<input type="number" step="0.1" id="weight"></label>'+btn('Guardar',"data.weight.push({date:new Date().toISOString(),kg:el('weight').value});save();render()")+'</div>'+data.weight.slice().reverse().map(x=>'<div class="card">'+fmt(new Date(x.date))+' · <b>'+x.kg+' kg</b></div>').join('')}
function profile(){return '<h2>Perfil y datos</h2><div class="card"><p>Los registros se guardan solo en este navegador y dispositivo. Haz copias periódicas.</p>'+btn('Exportar copia JSON',"exportData()")+'<p class="muted">Sin cuenta, sincronización, IA de fotografías ni Garmin FIT en esta versión.</p></div>'}
function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='nutrifit-copia.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
</script></html>
